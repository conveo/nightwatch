name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Pull requests run only the jobs whose folders changed, so a PR under
  # examples/nyc-live/ does not wait on the mesh suite. Pushes to main run everything.
  # A conflicting PR runs no workflow at all, so a PR without this job's check has
  # skipped CI; one with it and some jobs skipped is normal.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mesh: ${{ steps.areas.outputs.mesh }}
      dashboard: ${{ steps.areas.outputs.dashboard }}
      overlay: ${{ steps.areas.outputs.overlay }}
      nyc-live: ${{ steps.areas.outputs.nyc-live }}
      skills: ${{ steps.areas.outputs.skills }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE"...HEAD)"
          else
            files="*"
          fi
          printf 'changed files:\n%s\n' "$files"
          shared='\.github/workflows/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$'
          area() {
            if [ "$files" = "*" ] || printf '%s\n' "$files" | grep -q -E "^($1|$shared)"; then echo true; else echo false; fi
          }
          {
            echo "mesh=$(area 'agent-mesh/|docker-compose\.yml$|scripts/')"
            echo "dashboard=$(area 'agent-mesh/dashboard/')"
            echo "overlay=$(area 'reviewer-overlay/')"
            echo "nyc-live=$(area 'examples/nyc-live/')"
            echo "skills=$(area 'skills/')"
          } | tee -a "$GITHUB_OUTPUT"

  mesh:
    name: Typecheck, tests, verify.sh
    needs: changes
    if: needs.changes.outputs.mesh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      AGENT_MESH_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            agent-mesh/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Dashboard dependencies (the plan sanitizer tests load dompurify, else they SKIP)
        run: pnpm --dir agent-mesh/dashboard install --frozen-lockfile
      - run: pnpm typecheck
      - name: Tests (real Redis, key prefix "meshtest")
        run: pnpm test
      - name: verify.sh (daemon, two agents, message, receipt)
        run: ./agent-mesh/verify.sh

  dashboard:
    name: Dashboard build
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agent-mesh/dashboard/pnpm-lock.yaml
      - run: pnpm --dir agent-mesh/dashboard install --frozen-lockfile
      - run: pnpm --dir agent-mesh/dashboard exec tsc --noEmit -p .
      - run: pnpm --dir agent-mesh/dashboard build

  overlay:
    name: Reviewer overlay typecheck, tests, client build
    needs: changes
    if: needs.changes.outputs.overlay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir reviewer-overlay typecheck
      - name: Unit tests (server and markdown, node:test)
        run: pnpm --dir reviewer-overlay test
      - name: Client build (ESM and classic script bundles)
        run: pnpm --dir reviewer-overlay build

  nyc-live:
    name: nyc-live example typecheck, tests, build
    needs: changes
    if: needs.changes.outputs.nyc-live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/nyc-live/pnpm-lock.yaml
      - run: pnpm --dir examples/nyc-live install --frozen-lockfile
      - run: pnpm --dir examples/nyc-live typecheck
      - name: Unit tests (visual checks replay recorded answers, so no API key)
        run: pnpm --dir examples/nyc-live test
      - run: pnpm --dir examples/nyc-live build

  skills:
    name: Skill files parse
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: JSON files parse
        run: |
          for f in skills/human-review/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" && echo "ok $f"
          done
      - name: Every skill has front matter with a name and a description
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "no front matter: $f"; exit 1; }
            grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "missing name/description: $f"; exit 1; }
            echo "ok $f"
          done

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan the working tree and the full history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --verbose
